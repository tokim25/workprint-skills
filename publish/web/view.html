<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Workprint</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p id="status" class="note">Opening report…</p>
  <article id="report" class="report"></article>
  <footer id="foot" hidden>
    <p class="note">Written by the creator's AI assistant from the evidence they chose to share. Workprint has not verified it, and it makes no claim about who authored the work.</p>
    <a class="button" href="https://github.com/tokim25/workprint-skills">Make yours</a>
  </footer>
</main>
<script type="module">
import { decryptReport, validateReport, renderReport } from "./workprint.js";

const $ = (id) => document.getElementById(id);
const fail = (msg) => { $("status").textContent = msg; };

try {
  const [id, key] = location.hash.slice(1).split(".");
  if (!id || !key) throw new Error("link");
  const res = await fetch(`api/reports/${encodeURIComponent(id)}`);
  if (res.status === 404 || res.status === 410) throw new Error("gone");
  const report = await decryptReport(await res.json(), key);
  const errs = validateReport(report);
  if (errs.length) throw new Error("invalid");
  $("status").hidden = true;
  renderReport(document, $("report"), report);
  $("foot").hidden = false;
} catch (e) {
  fail(e.message === "gone" ? "This report has expired or was deleted."
     : "This link is incomplete or the report could not be opened.");
}
</script>
</body>
</html>
